name: Загрузка данных

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/fetch.py"
      - ".github/workflows/update.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Скачать матчи
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python3 scripts/fetch.py
      - name: Сохранить данные
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Обновление данных" && git pull --rebase && git push)
