name: SOW-X Auto Predictor

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
  runs-on: ubuntu-latest
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Run calculation pipeline
      run: python run_pipeline.py

    - name: Commit and push changes if predictions updated
      run: |
        git config --global user.name "SOW-Bot"
        git config --global user.email "bot@sow.win"
        git add matches.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update SOW-X predictions [skip ci]" && git push)
